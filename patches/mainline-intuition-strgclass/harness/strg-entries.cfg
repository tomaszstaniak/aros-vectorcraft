
menuentry "strgclass test: base before (not default)" {
    multiboot2 /boot/pc/bootstrap.xz ATA=32bit strgtest=before $bootstrap_flags
    module2 /boot/pc/kernel.xz
    module2 /boot/pc/aros-bsp.pkg.xz
    module2 /boot/pc/aros-acpi.pkg.xz
    module2 /boot/aros-base-strg-before.pkg.xz
    module2 /boot/aros-fs.pkg.xz
    module2 /boot/poseidon.pkg.xz
}

menuentry "strgclass test: base after (not default)" {
    multiboot2 /boot/pc/bootstrap.xz ATA=32bit strgtest=after $bootstrap_flags
    module2 /boot/pc/kernel.xz
    module2 /boot/pc/aros-bsp.pkg.xz
    module2 /boot/pc/aros-acpi.pkg.xz
    module2 /boot/aros-base-strg-after.pkg.xz
    module2 /boot/aros-fs.pkg.xz
    module2 /boot/poseidon.pkg.xz
}
