id              = "vectorcraft"
version         = "0.24.1"
revision        = 1
summary         = "Vector drawing program with SVG, PDF and EPS import and export"
category        = "graphics/edit"
license         = "MIT OR Apache-2.0"
kind            = "app"
arch            = "aarch64"
abi             = "v1"
subdir          = "VectorCraft"
icon            = "VectorCraft.info"
depends         = []
depends_checked = true
post_install_notes = [
  "Raspberry Pi build; needs a nightly of 2026-11-24 or later. Tested in an emulator only.",
  "The CPU renderer redraws only the parts of the window that changed; scrolling, zooming and other changes of the whole window are slower on slow machines.",
  "GUI_RENDERER ToolType: AUTO (default), CPU or GPU. AUTO uses OpenGL only when it is not Mesa software OpenGL.",
  "Settings, libraries, Data Recovery and the logs are kept in VectorCraftData in the program drawer; keep it when upgrading.",
  "File > Print saves a PDF; the clipboard carries text only. Updates come through the AROS package manager.",
]

# System libraries the programs open: C runtime first, then window, pictures and requesters.

[[requires_system]]
type = "library"
id   = "stdc.library"

[[requires_system]]
type = "library"
id   = "posixc.library"

[[requires_system]]
type = "library"
id   = "stdcio.library"

[[requires_system]]
type = "library"
id   = "cybergraphics.library"

[[requires_system]]
type = "library"
id   = "iffparse.library"

[[requires_system]]
type = "library"
id   = "asl.library"

[[requires_system]]
type = "library"
id   = "datatypes.library"

[source]
repository = "https://github.com/tomaszstaniak/aros-vectorcraft"
revision   = "v0.24.1-r1"
archive    = "VectorCraft-0.24.1-r1-source.zip"
built_with = "Raspberry Pi AArch64 ABIv1 (nightly 2026-11-24 SDK), Clang 20.1.0, Rust nightly 1.100 (rust-aros), egui 0.37 through egui-aros"

[launch]
executable = "VectorCraft"
mode       = "workbench"
